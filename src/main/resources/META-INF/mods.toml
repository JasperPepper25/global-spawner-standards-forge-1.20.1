modLoader="javafml"
loaderVersion="[47,)"
license="MIT"
issueTrackerURL="https://github.com/JasperPepper25/global-spawner-standards-forge-1.20.1/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="JasperPepper25"
description='''
Applies configurable baseline attributes to vanilla mob spawners after their NBT is loaded, including structure-authored spawners, while preserving later upgrades. Includes structure whitelist/blacklist filtering.
'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="[${forge_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1,1.20.2)"
ordering="NONE"
side="BOTH"
