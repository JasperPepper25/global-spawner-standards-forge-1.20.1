name: Forge 1.20.1 Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build
        run: gradle --no-daemon build --stacktrace

      - name: Dedicated server functional smoke test
        shell: bash
        run: |
          mkdir -p run/config
          echo 'eula=true' > run/eula.txt
          cat > run/server.properties <<'PROPS'
          enable-rcon=true
          rcon.port=25575
          rcon.password=gss-ci
          online-mode=false
          server-port=25565
          level-name=world
          spawn-protection=0
          PROPS

          cat > run/config/global_spawner_standards-common.toml <<'CFG'
          [standardization]
            standardizationRevision = 1
            initialDelay = 20
            minSpawnDelay = 100
            maxSpawnDelay = 300
            spawnCount = 6
            maxNearbyEntities = 20
            requiredPlayerRange = 45
            spawnRange = 4

          [structure_filter]
            mode = "BLACKLIST"
            structures = ["minecraft:end_city"]

          [debug]
            logDecisions = true
          CFG

          set +e
          timeout --signal=INT 150s gradle --no-daemon runServer > server-smoke.log 2>&1 &
          SERVER_PID=$!
          set -e

          ready=0
          for i in $(seq 1 120); do
            if grep -Eq 'Done \([0-9.]+s\)!' server-smoke.log; then ready=1; break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then tail -n 200 server-smoke.log; exit 1; fi

          python3 - <<'PY'
          import socket, struct, time

          def send_packet(sock, request_id, packet_type, body):
              payload = struct.pack('<ii', request_id, packet_type) + body.encode() + b'\x00\x00'
              sock.sendall(struct.pack('<i', len(payload)) + payload)

          def recv_packet(sock):
              raw = sock.recv(4)
              if len(raw) != 4:
                  raise RuntimeError('RCON closed')
              length = struct.unpack('<i', raw)[0]
              data = b''
              while len(data) < length:
                  chunk = sock.recv(length - len(data))
                  if not chunk:
                      raise RuntimeError('RCON closed mid-packet')
                  data += chunk
              return struct.unpack('<ii', data[:8]) + (data[8:-2].decode(errors='replace'),)

          deadline = time.time() + 20
          sock = None
          while time.time() < deadline:
              try:
                  sock = socket.create_connection(('127.0.0.1', 25575), timeout=3)
                  break
              except OSError:
                  time.sleep(0.5)
          if sock is None:
              raise RuntimeError('RCON unavailable')

          with sock:
              send_packet(sock, 1, 3, 'gss-ci')
              if recv_packet(sock)[0] == -1:
                  raise RuntimeError('RCON auth failed')

              commands = [
                  'setworldspawn 0 100 0',
                  'forceload add 0 0',
                  'setblock 0 100 0 minecraft:spawner{Delay:0s,MinSpawnDelay:200s,MaxSpawnDelay:400s,SpawnCount:2s,MaxNearbyEntities:6s,RequiredPlayerRange:12s,SpawnRange:4s,SpawnData:{entity:{id:"minecraft:zombie"}}} replace',
              ]
              req = 10
              for command in commands:
                  send_packet(sock, req, 2, command)
                  print(command, '=>', recv_packet(sock)[2])
                  req += 1

              time.sleep(3)

              checks = {
                  'Delay': '20s',
                  'MinSpawnDelay': '100s',
                  'MaxSpawnDelay': '300s',
                  'SpawnCount': '6s',
                  'MaxNearbyEntities': '20s',
                  'RequiredPlayerRange': '45s',
                  'SpawnRange': '4s',
                  'ForgeData.GlobalSpawnerStandards.EvaluatedRevision': '1',
                  'ForgeData.GlobalSpawnerStandards.Applied': '1b',
              }

              for path, expected in checks.items():
                  command = f'data get block 0 100 0 {path}'
                  send_packet(sock, req, 2, command)
                  response = recv_packet(sock)[2]
                  print(command, '=>', response)
                  if expected not in response:
                      raise RuntimeError(f'Expected {expected!r} in response for {path}: {response!r}')
                  req += 1

              send_packet(sock, req, 2, 'data merge block 0 100 0 {SpawnCount:9s}')
              print('manual post-standardization edit =>', recv_packet(sock)[2])
              req += 1
              time.sleep(2)
              send_packet(sock, req, 2, 'data get block 0 100 0 SpawnCount')
              response = recv_packet(sock)[2]
              print('one-time preservation check =>', response)
              if '9s' not in response:
                  raise RuntimeError('Spawner was re-standardized every tick instead of once per revision')
              req += 1

              send_packet(sock, req, 2, 'stop')
              try:
                  recv_packet(sock)
              except Exception:
                  pass
          PY

          set +e
          wait "$SERVER_PID"
          status=$?
          set -e
          tail -n 200 server-smoke.log

          if grep -Eq 'Failed to start the minecraft server|MixinApplyError|MixinTransformerError|Caught exception from global_spawner_standards' server-smoke.log; then
            exit 1
          fi
          grep -q 'Standardized spawner at' server-smoke.log
          echo "Dedicated server functional test passed (process exit $status)."

      - name: Headless client smoke test
        shell: bash
        run: |
          command -v xvfb-run >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y xvfb; }
          rm -f run/logs/latest.log client-smoke.log
          set +e
          LIBGL_ALWAYS_SOFTWARE=1 timeout --signal=INT 120s xvfb-run -a gradle --no-daemon runClient > client-smoke.log 2>&1
          status=$?
          set -e
          if [ -f run/logs/latest.log ]; then cat run/logs/latest.log >> client-smoke.log; fi
          tail -n 160 client-smoke.log
          grep -q 'Reloading ResourceManager: vanilla, mod_resources' client-smoke.log
          if grep -Eq 'MixinApplyError|MixinTransformerError|Failed to create window|Exception in thread "Render thread"|Caught exception from global_spawner_standards' client-smoke.log; then
            exit 1
          fi
          echo "Headless client initialized successfully (process exit $status)."

      - name: Validate built jar
        shell: bash
        run: |
          JAR="$(find build/libs -maxdepth 1 -name 'global-spawner-standards-0.1.0+1.20.1.jar' -type f | head -n 1)"
          test -n "$JAR"
          unzip -l "$JAR" > jar-contents.txt
          grep -q 'META-INF/mods.toml$' jar-contents.txt
          grep -q 'global_spawner_standards.mixins.json$' jar-contents.txt
          grep -q 'SpawnerStandardizer.class$' jar-contents.txt
          grep -q '^ *[0-9].* LICENSE$' jar-contents.txt

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: global-spawner-standards-forge-1.20.1-v0.1.0
          path: build/libs/global-spawner-standards-0.1.0+1.20.1.jar
          if-no-files-found: error
